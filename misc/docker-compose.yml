services:
  jbb:
    image: josefilipeferreira/jbb.py
    container_name: jbb
    volumes:
      - ${DATADIR}/jbb/config.yaml:/config.yaml
      - ${DATADIR}/jbb/db:/db
      - ${DATADIR}/jbb/media:/media
      - ${DATADIR}/jbb/music:/music
    restart: unless-stopped

  bentopdf:
    image: ghcr.io/alam00000/bentopdf-simple
    container_name: bentopdf
    ports:
      - 3004:8080
    restart: unless-stopped
    networks:
      - caddy
    labels:
      # Caddy
      caddy: pdf.${WEBSITE}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      # Plato
      plato.category: "Tools"

  planning-poker:
    image: docker.io/axeleroy/self-host-planning-poker
    container_name: planning-poker
    ports:
      - 8666:8000
    volumes:
      - ${DATADIR}/planning-poker/data:/data
    networks:
      - caddy
    labels:
      # Caddy
      caddy: poker.${WEBSITE}
      caddy.reverse_proxy: "{{upstreams 8000}}"
      # Plato
      plato.category: "Tools"
      plato.name: "Poker"

  spoolman:
    image: ghcr.io/donkie/spoolman
    container_name: spoolman
    restart: unless-stopped
    volumes:
      - ${DATADIR}/spoolman/data:/home/app/.local/share/spoolman
    ports:
      - 7912:8000
    environment:
      TZ: ${TZ}
    labels:
      # Plato
      plato.category: "Tools"

networks:
  caddy:
    external: true
